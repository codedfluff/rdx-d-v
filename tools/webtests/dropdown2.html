<!DOCTYPE html>
<html><head><title>header dropdown</title>
<style>
body { font: 16px sans-serif; margin: 0; }
.mw-header { display: grid; column-gap: 24px; grid-template: auto / 15.5rem minmax(0,1fr); grid-template-areas: 'headerStart headerEnd';
  padding: 8px 24px; position: relative; }
.mw-header .vector-header-start { grid-area: headerStart; display: flex; align-items: center; gap: 20px; }
.vector-dropdown { position: relative; }
.vector-dropdown .vector-dropdown-checkbox { cursor: pointer; position: absolute; top: 0; left: 0; z-index: 1; opacity: 0; width: 100%; height: 100%; margin: 0; padding: 0; }
.cdx-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; min-height: 32px; max-width: 28rem; margin: 0;
  border: 1px solid transparent; border-radius: 2px; padding: 0 11px; font-weight: 700; overflow: hidden; white-space: nowrap; }
.cdx-button--icon-only { min-width: 32px; padding-right: 0; padding-left: 0; }
.vector-header .cdx-button.cdx-button--icon-only { min-height: 44px; min-width: 44px; }
.cdx-button.cdx-button--icon-only span + span { display: block; position: absolute !important; clip: rect(1px,1px,1px,1px); width: 1px; height: 1px; margin: -1px; border: 0; padding: 0; overflow: hidden; }
.vector-icon { min-width: 10px; min-height: 10px; width: 20px; height: 20px; display: inline-block; vertical-align: text-bottom; background: #202122; }
.vector-dropdown-content { position: absolute; top: 100%; left: -9999px; opacity: 0; height: 0; overflow: hidden; }
.logo { display: block; width: 140px; height: 38px; background: #ccc; }
</style></head>
<body>
<div class="vector-header-container">
  <header class="vector-header mw-header">
    <div class="vector-header-start">
      <nav class="vector-main-menu-landmark" aria-label="Site">
<div id="dd" class="vector-dropdown">
	<input type="checkbox" id="cb" class="vector-dropdown-checkbox">
	<label id="lbl" for="cb" class="vector-dropdown-label cdx-button cdx-button--icon-only"><span class="vector-icon"></span>

<span class="vector-dropdown-label-text">Main menu</span>
	</label>
	<div class="vector-dropdown-content"><div>menu items</div></div>
</div>
      </nav>
      <a class="logo" href="#"></a>
    </div>
    <div class="vector-header-end">end</div>
  </header>
</div>
</body></html>
