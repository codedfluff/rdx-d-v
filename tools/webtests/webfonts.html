<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Web fonts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;700&family=Mulish&display=swap">
<style>
body { margin: 16px; font-size: 22px; }
.lobster { font-family: 'Lobster', cursive; font-size: 34px; }
.inter { font-family: 'Inter', sans-serif; }
.mulish { font-family: 'Mulish', sans-serif; }
</style></head><body>
<p class="lobster">Lobster, a script font</p>
<p class="inter">Inter regular, <b>Inter bold</b></p>
<p class="mulish">Mulish (a variable font: default weight is thin)</p>
<p>FONTS END</p>
</body></html>
