<!DOCTYPE html>
<html><head><title>dropdown variants</title>
<style>
body { font: 16px sans-serif; margin: 0; }
.row { display: flex; align-items: flex-start; gap: 20px; padding: 8px; }
.dd { position: relative; background: #eef; }
.cb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: .3; }
.lbl { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; background: #fcc; overflow: hidden; }
.lbl span + span { display: block; position: absolute; width: 1px; height: 1px; overflow: hidden; }
.icon { display: inline-block; width: 20px; height: 20px; background: #222; vertical-align: text-bottom; }
.content { position: absolute; top: 100%; left: -9999px; height: 0; overflow: hidden; }
</style></head>
<body>
<div class="row">
  <!-- A: as Wikipedia -->
  <div class="dd" id="a"> <input type="checkbox" class="cb"> <label class="lbl" id="la"><span class="icon"></span> <span>Main menu</span> </label> <div class="content">x</div> </div>
  <!-- B: no dropdown content -->
  <div class="dd" id="b"> <input type="checkbox" class="cb"> <label class="lbl" id="lb"><span class="icon"></span> <span>Main menu</span> </label> </div>
  <!-- C: no checkbox -->
  <div class="dd" id="c"> <label class="lbl" id="lc"><span class="icon"></span> <span>Main menu</span> </label> <div class="content">x</div> </div>
  <!-- D: label without the hidden text span -->
  <div class="dd" id="d"> <input type="checkbox" class="cb"> <label class="lbl" id="ld"><span class="icon"></span></label> <div class="content">x</div> </div>
  <!-- E: a div instead of the checkbox -->
  <div class="dd" id="e"> <div class="cb"></div> <label class="lbl" id="le"><span class="icon"></span> <span>Main menu</span> </label> <div class="content">x</div> </div>
</div>
</body></html>
