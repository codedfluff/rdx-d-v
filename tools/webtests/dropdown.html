<!DOCTYPE html><html><head><title>Icon button</title><style>
body { font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; margin: 10px; }
.dd { position: relative; background: #eef; }
.dd input { position: absolute; top: 0; left: 0; opacity: 0; width: 100%; height: 100%; margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; min-width: 44px; height: 44px; box-sizing: border-box; padding: 0 11px; border: 1px solid transparent; background: #ddd; }
.icon { display: inline-block; width: 20px; height: 20px; background: #333; }
.hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; }
.content { position: absolute; visibility: hidden; }
</style></head><body>
<div class="dd">
  <input type="checkbox">
  <label class="btn"><span class="icon"></span><span class="hidden">Main menu</span></label>
  <div class="content">menu items</div>
</div>
<p>DROPDOWN END</p>
</body></html>
